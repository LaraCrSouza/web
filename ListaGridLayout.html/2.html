<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-color: black;
            margin: 0;
        }

       
        .container{
            background-color: white;
            padding: 5px;
            display: grid;
            height: 100vh;
            gap: 5px;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: 2fr 3fr 1fr;
            grid-template-areas: "header header"
                                 "nav content"
                                 "nav footer";
        }
        .box{
            display: flex;
            color: black;
            background-color: rgb(56, 56, 56);
            border-radius: 5px;
            padding: 10px;
            align-items: flex-start;    
            justify-content: flex-start; 
            font-size: 60px;
        }
        
        #header{
            grid-area: header;
            background-color: rgb(234, 75, 131);
            justify-content: center;
            
        }
        #content{
            grid-area: content;
            background-color: rgb(227, 165, 116);
            justify-content: center;
        }
        #nav{
            grid-area: nav;
            background-color: rgb(162, 182, 129);
            justify-content: center;  
            align-items: center;      
        }
        #footer { 
            grid-area: footer; 
            background-color: rgb(99, 143, 118);
            justify-content: center;
        }
      
       

    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="header">Header</div>
        <div class="box" id="content">Content</div>
        <div class="box" id="nav">Nav</div>
        <div class="box" id="footer">Footer</div>
    </div>
</body>
</html>
