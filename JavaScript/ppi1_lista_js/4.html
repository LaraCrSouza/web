<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculo de IMC</h1>
     <div>
            <label for="entradaNome">Nome</label>
            <input type="text" name="" id="nome">

            <label for="entradaPeso">Peso</label>
            <input type="number" id="peso" step="0.1">

            <label for="entradaAltura">Altura</label>
            <input type="number" id="altura" step="0.01">

            <button id="botao">Calcular</button>
        </div>
        <div class="resultado">
            
            <p id="resultadoIMC"></p>
            <p id="classificacao"></p>

            <img id="imgPerfil">
        </div>

        <script>

        const nomeCampo= document.getElementById('nome');
        const pesoCampo = document.getElementById('peso');
        const alturaCampo= document.getElementById('altura');

        botao.addEventListener("click", () => {

        const nomeValor = nomeCampo.value.trim();
        const pesoValor = pesoCampo.value.trim();
        const alturaValor = alturaCampo.value.trim();

        

        if (nomeValor === "" || pesoValor === "" || alturaValor === "") {
            alert("Erro: Preencha todos os campos antes de continuar!");
            return; 
        }

        const peso = parseFloat(pesoValor);
        const altura = parseFloat(alturaValor);

        const imc = peso / (altura * altura);
        document.getElementById('resultadoIMC').innerText;

        document.getElementById('resultadoIMC').innerText = `${nomeValor}, seu IMC é ${imc.toFixed(2)}`;

        const texto = document.getElementById('classificacao');
        const imagem = document.getElementById('imgPerfil');


        if(imc<18.5){
            texto.innerText = "Abaixo do peso";

        } else if (imc<=24.9){
            texto.innerText = "Peso normal";

        } else if (imc <= 29.9){
            texto.innerText = "Sobrepeso";

        } else if (imc <= 34.9){
            texto.innerText = "Obesidade grau 1";

        } else if (imc <= 39.9){
            texto.innerText = "Obesidade grau 2";

        }else{
            texto.innerText = "Obesidade grau 3(mórbida)";
        }

        const imgPerfil = document.getElementById('imgPerfil');
        imgPerfil.style.display = 'block';

         const imcarredondado = Math.floor(imc);

        switch (true) {

        case (imc<18.5):
            imgPerfil.src = "imgPerfil/abaixopeso.png";
            break;

        case (imc<=24.9):
            imgPerfil.src = "imgPerfil/normal.png";
            break;

        case (imc <= 29.9):
            imgPerfil.src = "imgPerfil/sobrepeso.png";
            break;

        case (imc <= 34.9):
            imgPerfil.src = "imgPerfil/obesidade1.png";
            break;

        case (imc <= 39.9):
            imgPerfil.src = "imgPerfil/obesidade2.png";
            break;

        default:
            imgPerfil.src = "imgPerfil/obesidade3.png";
            break;
        }
    
        });
        </script>

</body>
</html>
