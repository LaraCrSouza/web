


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-color: burlywood;
        }
        .containerPrincipal{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            
        }

        .container{
            display: grid;
            grid-template-areas: "azul branco vermelhoF";
            grid-template-columns: 1fr 1fr 1fr;
            width: 350px;
            height: 200px;
            
        }

        .box{
            display: grid;
        }

        #box-F-1{
            background-color: blue;
             grid-area: azul;
        }

        #box-F-2{
            background-color: white;
             grid-area: branco;
        }

        #box-F-3{
            background-color: red;
             grid-area: vermelhoF;
        }

        .container2{
            display: grid;
            width: 350px;
            grid-template-areas: "preto" 
                                 "vermelho" 
                                 "amarelo";
            grid-template-rows: 1fr 1fr 1fr;
            height: 200px;
        }


        #box-A-1{
            background-color: black;
            grid-area: preto;
        }

        #box-A-2{
            background-color: red;
            grid-area: vermelho;
        }
        #box-A-3{
            background-color: yellow;
            grid-area: amarelo;
        }

        .container3{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #box-J-1{
        background-color: white;
        grid-area: bandeira;    
        width: 350px;   
        height: 200px;  
        display: flex;               
        justify-content: center;
        align-items: center;
        }
        
        #circulo{
            background-color: red;
            border-radius: 50%;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>

    <div class="containerPrincipal">
    
        <div class="container">
            <div class="box" id="box-F-1"></div>
            <div class="box" id="box-F-2"></div>
            <div class="box" id="box-F-3"></div>
        </div>

        <div class="container2">
            <div class="box2" id="box-A-1"></div>
            <div class="box2" id="box-A-2"></div>
            <div class="box2" id="box-A-3"></div>
        </div>

        <div class="container3">

            <div class="box2" id="box-J-1">
                <div class="circulo" id="circulo"></div>
            </div>
            
        </div>

    </div>
</body>
</html>
